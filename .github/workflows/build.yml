name: Build & Test

on: [push, pull_request]

jobs:
  test:
    name: test (keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    # Avoid duplicate runs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and latest
        keycloak: ["26.0", "latest"]
    env:
      KEYCLOAK_VERSION: ${{ matrix.keycloak }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install package
        run: pip install -e .[dev,docs]

      - name: Install make
        run: sudo apt update && sudo apt -y --no-install-recommends install make

      - name: Lint
        run: make lint

      - name: Check manifest
        run: check-manifest

      - name: Mypy
        run: make mypy

      - name: Pull images
        run: docker compose pull keycloak tox

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Test docs
        run: make docs-test

      - name: Build docs
        run: make docs

      - name: CodeCov
        if: matrix.keycloak == 'latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: derlin/mantelo
          files: .artifacts/coverage.xml
          disable_search: true
          # Put a plugin we don't use, to ensure it doesn't try
          # to generate its own coverage.xml using the pycoverage plugin
          plugins: xcode
          verbose: true

      - name: Upload coverage reports
        if: matrix.keycloak == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .artifacts/
          include-hidden-files: true

      - name: Upload artifacts
        if: matrix.keycloak == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            dist/*.*
            docs/_build/html
            docs/_build/doctest

  # Branch protection requires a "build" check. A skipped matrix job reports
  # an unexpanded name, so this job reports one stable result instead.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "${{ needs.test.result }}" =~ ^(success|skipped)$ ]]'
